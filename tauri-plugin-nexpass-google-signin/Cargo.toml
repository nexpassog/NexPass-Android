[package]
name = "tauri-plugin-nexpass-google-signin"
version = "0.1.0"
description = "Native Android Google Sign-In for NexPass using Google Identity Services"
edition = "2021"
license = "MIT"

[lib]
name = "tauri_plugin_nexpass_google_signin"
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }