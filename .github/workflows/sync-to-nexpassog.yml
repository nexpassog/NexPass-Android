name: Sync to NexPassOG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Sync to NexPassOG
    runs-on: ubuntu-latest
    if: github.repository == 'nexerisltd/NexPass-Android'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        env:
          NEXPASSOG_TOKEN: ${{ secrets.NEXPASSOG_TOKEN }}
        run: |
          git remote add upstream https://${{ secrets.NEXPASSOG_TOKEN }}@github.com/NexPassOG/NexPass-Android.git

      - name: Push to upstream
        run: |
          git push upstream main --force
        env:
          NEXPASSOG_TOKEN: ${{ secrets.NEXPASSOG_TOKEN }}
