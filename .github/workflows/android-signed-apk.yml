name: Android signed APK build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init

      - name: Generate app icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Write Rust OAuth secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "FIREBASE_API_KEY")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub Actions secrets: {', '.join(missing)}")

          output = Path("src-tauri/src/secrets.rs")
          output.write_text(
              "".join(f'pub const {name}: &str = {json.dumps(os.environ[name])};\n' for name in names),
              encoding="utf-8",
          )
          PY

      - name: Patch Android project for signed builds and in-app APK install
        run: |
          python3 .github/scripts/patch_gradle.py
          python3 .github/scripts/patch_android_installer.py

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Write Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub Actions secrets: {', '.join(missing)}")

          android_dir = Path("src-tauri/gen/android")
          android_dir.mkdir(parents=True, exist_ok=True)
          try:
              encoded_keystore = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
              keystore = base64.b64decode(encoded_keystore, validate=True)
          except ValueError as error:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 is not valid base64: {error}")
          (android_dir / "nexpass-release.jks").write_bytes(keystore)
          (android_dir / "keystore.properties").write_text(
              "storeFile=../nexpass-release.jks\n"
              f"storePassword={os.environ['ANDROID_KEYSTORE_PASSWORD']}\n"
              f"keyAlias={os.environ['ANDROID_KEY_ALIAS']}\n"
              f"keyPassword={os.environ['ANDROID_KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          PY

      - name: Build signed APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npx tauri android build --apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nexpass-signed-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
