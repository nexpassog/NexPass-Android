[package]
name = "nexpass"
version = "6.1.2"
description = "NexPass — secure local credential vault"
authors = ["Arabi Islam, MR. ARX <NexApp>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-nexpass-installer = { path = "../tauri-plugin-nexpass-installer" }
tauri-plugin-nexpass-autofill = { path = "../tauri-plugin-nexpass-autofill" }
tauri-plugin-nexpass-google-signin = { path = "../tauri-plugin-nexpass-google-signin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto layer — used by crypto.rs (key derivation + encrypt/decrypt)
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# Google Sign-In (system browser + loopback redirect) + Firebase Auth REST calls.
# rustls-tls (not the default native-tls) because native-tls needs OpenSSL
# cross-compiled for the Android NDK target, which is a common source of
# Android build failures; rustls is pure Rust and cross-compiles cleanly.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# TOTP (RFC 6238) 2FA codes stored on entries + HIBP k-anonymity breach check.
sha1 = "0.10"
hmac = "0.12"
base32 = "0.5"
# PKCE S256 challenge for the Google OAuth loopback flow.
sha2 = "0.10"

# Tray icon + window vibrancy have no Android/iOS equivalent — only
# pulled in (and only compiled) for desktop targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
window-vibrancy = "0.5"
tauri = { version = "2", features = ["tray-icon"] }
# Windows Hello unlock gate — desktop targets of this crate (Android
# builds exclude it; the lib.rs stub covers those).
windows = { version = "0.58", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_WinRT"] }

# Biometric unlock (fingerprint / face) — Android + iOS only, no desktop equivalent.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[lib]
name = "nexpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexpass"
path = "src/main.rs"

# Release build tuning — smaller binary, faster startup.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true